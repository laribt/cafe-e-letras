
{% extends "acervo/base.html" %}

{% block conteudo %}
<h1>{{ titulo }}</h1>

<form method="post" class="card p-4 mt-3">
    {% csrf_token %}

    {% if form.non_field_errors %}
        <div class="alert alert-danger" role="alert">
            {{ form.non_field_errors }}
        </div>
    {% endif %}

    {% for campo in form %}
        <div class="mb-3">
            <label for="{{ campo.id_for_label }}"
                   class="form-label">
                {{ campo.label }}
            </label>

            <div>{{ campo }}</div>

            {% if campo.errors %}
                <div class="text-danger" role="alert">
                    {{ campo.errors }}
                </div>
            {% endif %}
        </div>
    {% endfor %}

    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success">
            Salvar
        </button>

        <a href="{% url 'inicio' %}"
           class="btn btn-outline-secondary">
            Cancelar
        </a>
    </div>
</form>
{% endblock %}
